services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nutrify
      POSTGRES_USER: nutrify
      POSTGRES_PASSWORD: nutrify-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrify -d nutrify"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    environment:
      DJANGO_SECRET_KEY: dev-only-change-me-not-for-production-32
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      DATABASE_URL: postgres://nutrify:nutrify-dev-only@db:5432/nutrify
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
